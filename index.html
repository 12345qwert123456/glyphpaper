<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d13">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon-48.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <nav id="switcher" class="pill" aria-label="Creatures">
    <div id="species-list" class="species-list"></div>
    <button id="picker-toggle" class="picker-toggle" type="button" aria-label="Hide creature picker" title="Hide creature picker" aria-expanded="true">
      <i id="picker-dot" class="dot"></i>
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </nav>

  <button id="settings-btn" class="round" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
    </svg>
  </button>

  <section id="settings" class="panel" hidden aria-label="Settings">
    <h2>Greeting</h2>
    <label class="field">
      <span>Name</span>
      <input id="set-name" type="text" maxlength="40" placeholder="for the greeting" autocomplete="off" spellcheck="false">
    </label>

    <h2>Creatures</h2>
    <label class="field"><span>Count <output id="out-count"></output></span><input id="set-count" type="range" min="25" max="200" step="5"></label>
    <label class="field"><span>Speed <output id="out-speed"></output></span><input id="set-speed" type="range" min="25" max="200" step="5"></label>
    <label class="field"><span>Size <output id="out-size"></output></span><input id="set-size" type="range" min="60" max="160" step="5"></label>
    <label class="field"><span>Cursor reaction <output id="out-react"></output></span><input id="set-react" type="range" min="0" max="200" step="10"></label>

    <h2>Look</h2>
    <label class="field"><span>Cell size <output id="out-cell"></output></span><input id="set-cell" type="range" min="6" max="14" step="1"></label>
    <label class="field"><span>Glyph density <output id="out-density"></output></span><input id="set-density" type="range" min="0" max="100" step="5"></label>
    <label class="field"><span>Grid <output id="out-grid"></output></span><input id="set-grid" type="range" min="0" max="200" step="5"></label>
    <label class="field"><span>Dust <output id="out-dust"></output></span><input id="set-dust" type="range" min="0" max="200" step="5"></label>
    <label class="field"><span>Ground <small>how much land shows through</small> <output id="out-ground"></output></span><input id="set-ground" type="range" min="0" max="200" step="5"></label>
    <label class="field"><span>Space effects <small>wind, waves, bubbles</small> <output id="out-effects"></output></span><input id="set-effects" type="range" min="0" max="200" step="5"></label>

    <h2>Colors</h2>
    <div class="field">
      <span>Mode <output id="out-color"></output></span>
      <div class="segmented" id="set-color" role="radiogroup" aria-label="Color mode">
        <button type="button" role="radio" data-mode="auto">Auto</button>
        <button type="button" role="radio" data-mode="natural">Natural</button>
        <button type="button" role="radio" data-mode="adaptive">Adaptive</button>
      </div>
    </div>
    <div class="field" id="row-tint">
      <span>Creature color <small>forces the color</small> <output id="out-tint"></output></span>
      <div class="swatches" id="tint-swatches" role="radiogroup" aria-label="Creature color"></div>
      <label class="toggle"><input id="set-tintAll" type="checkbox"><span>Use for all creatures</span></label>
    </div>
    <label class="field" id="row-palette">
      <span>Palette URL</span>
      <input id="set-palette" type="text" autocomplete="off" spellcheck="false">
    </label>

    <h2>Search and voice</h2>
    <label class="field" id="row-search">
      <span>Search URL <small>%s = query</small></span>
      <input id="set-search" type="text" autocomplete="off" spellcheck="false">
    </label>
    <label class="toggle"><input id="set-voice" type="checkbox"><span>Voice input <small id="voice-note"></small></span></label>
    <label class="toggle" id="row-voice-auto"><input id="set-voiceAuto" type="checkbox"><span>Search right after dictation</span></label>
    <label class="field" id="row-voice-lang">
      <span>Voice language <small>empty = browser</small></span>
      <input id="set-voiceLang" type="text" maxlength="12" placeholder="ru-RU, en-US…" autocomplete="off" spellcheck="false">
    </label>

    <h2>Interface</h2>
    <label class="toggle"><input id="set-picker" type="checkbox"><span>Show creature picker</span></label>

    <h2>Animation</h2>
    <label class="toggle"><input id="set-paused" type="checkbox"><span>Pause animation</span></label>
    <label class="toggle"><input id="set-hint" type="checkbox"><span>Show “hold · drag” hint</span></label>
    <label class="toggle"><input id="set-saver" type="checkbox"><span>Battery saver <small>30 fps, fewer effects</small></span></label>

    <button id="set-reset" class="reset" type="button">Reset to defaults</button>
  </section>

  <main id="center">
    <button id="orb" class="orb" type="button" aria-label="Voice input" title="Voice input" hidden>
      <canvas id="orb-canvas" aria-hidden="true"></canvas>
    </button>
    <h1 id="greeting"></h1>
    <form id="search" class="search" role="search" autocomplete="off">
      <svg class="lens" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </svg>
      <input id="q" name="q" type="text" placeholder="Ask anything…" aria-label="Search" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="mic" class="icon" type="button" aria-label="Voice input" title="Voice input" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>
        </svg>
      </button>
      <button class="send" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </main>

  <div id="hint" aria-hidden="true">hold · drag</div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/atlas.js"></script>
  <script src="js/raster.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/creatures/base.js"></script>
  <script src="js/creatures/butterfly.js"></script>
  <script src="js/creatures/jellyfish.js"></script>
  <script src="js/creatures/dragonfly.js"></script>
  <script src="js/creatures/chain.js"></script>
  <script src="js/creatures/koi.js"></script>
  <script src="js/creatures/frog.js"></script>
  <script src="js/creatures/crane.js"></script>
  <script src="js/creatures/crab.js"></script>
  <script src="js/creatures/turtle.js"></script>
  <script src="js/creatures/ladybug.js"></script>
  <script src="js/creatures/swan.js"></script>
  <script src="js/creatures/ray.js"></script>
  <script src="js/creatures/snake.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
